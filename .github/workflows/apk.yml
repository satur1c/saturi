name: apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npx cap init SATURI com.saturi.reader --web-dir=www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore debug.keystore
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git add debug.keystore
            git commit -m "add signing key"
            git push
          fi
      -       - run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
            buildscript.repositories.all { r -> if (r instanceof MavenArtifactRepository && r.url.toString().contains('maven.apache.org')) r.url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
            repositories.all { r -> if (r instanceof MavenArtifactRepository && r.url.toString().contains('maven.apache.org')) r.url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
          }
          EOF
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: saturi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
