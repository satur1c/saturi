<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFF9FB"><title>SATURI</title>
<style>
:root{--p:#E11D74;--p2:#F472B6;--p3:#FB7185;--l1:#FBCFE8;--l2:#FCE7F3;--l3:#FFF0F5;--bg:#FFF9FB;--ink:#3B0D22;--ink2:#881337;--mut:#9D174D;--sh:0 8px 24px rgba(225,29,116,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 50% at 50% -8%,#FCE7F3,transparent 65%),var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;padding-top:env(safe-area-inset-top);-webkit-user-select:none;user-select:none}
.serif,h2{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 6px}
.logo{font-size:25px;font-weight:800;letter-spacing:.14em}
.logo i{color:var(--p);font-style:normal}
.chip{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--l1);border-radius:99px;padding:4px 13px 4px 8px;font-weight:800;color:var(--p);box-shadow:var(--sh)}
.chip svg{width:20px;height:25px}
.off svg.fl{filter:grayscale(1) opacity(.4)}.off{color:#a8a29e}
.on-f svg.fl{animation:fl 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fl{50%{transform:scale(1.07) rotate(-2deg)}}
main{flex:1;overflow-y:auto;padding:6px 16px 170px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border:1px solid var(--l1);border-radius:28px;padding:6px;box-shadow:var(--sh);z-index:5}
nav button{flex:1;min-height:50px;border:0;background:none;color:var(--ink2);opacity:.6;border-radius:22px;font:700 10px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{background:var(--l3);color:var(--p);opacity:1}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2{margin:8px 0 2px;font-size:28px;line-height:1.1}
.sub{color:var(--mut);opacity:.75;font-size:13px}
.card{background:#fff;border:1px solid var(--l1);border-radius:26px;padding:16px;box-shadow:var(--sh);margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px}
.pill{border:1px solid var(--l1);background:#fff;color:var(--ink2);border-radius:99px;padding:9px 15px;font:700 13px system-ui;white-space:nowrap}
.pill.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bk{background:#fff;border:1px solid var(--l1);border-radius:22px;padding:9px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:3px}
.bk b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk i{font-style:normal;font-size:11px;color:var(--mut);opacity:.75;margin-bottom:4px}
.cv{aspect-ratio:2/3;border-radius:14px;color:#fff;padding:10px 10px 12px 14px;display:flex;align-items:flex-end;font:700 15px/1.15 Georgia,serif;box-shadow:inset 7px 0 0 rgba(0,0,0,.14);margin-bottom:6px;overflow:hidden;background-size:cover!important}
.bar{height:6px;background:var(--l2);border-radius:9px;overflow:hidden}
.bar u{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p3));border-radius:9px}
.btn{border:0;border-radius:18px;padding:14px 18px;font:800 14px system-ui;background:var(--p);color:#fff;box-shadow:0 6px 16px rgba(225,29,116,.3)}
.btn.s{background:var(--l3);color:var(--p);box-shadow:none;border:1px solid var(--l1)}
.fab{position:fixed;right:20px;bottom:calc(94px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;z-index:4;padding:0;display:grid;place-items:center}
input,textarea,select{width:100%;border:1px solid var(--l1);background:var(--l3);border-radius:14px;padding:12px;font:inherit;color:var(--ink);margin:4px 0 10px;-webkit-user-select:text;user-select:text}
label{font-size:12px;font-weight:700;color:var(--ink2)}
.ov{position:fixed;inset:0;background:rgba(59,13,34,.45);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;animation:fi .2s}
.sh{background:#fff;width:100%;max-height:90%;overflow:auto;border-radius:32px 32px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(40px)}}
.sw{position:relative;width:54px;height:30px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;z-index:1}
.sw s{position:absolute;inset:0;background:var(--l1);border-radius:99px;transition:.2s}
.sw s:after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+s{background:var(--p)}.sw input:checked+s:after{transform:translateX(24px)}
.fw{position:relative;width:170px;height:170px;margin:6px auto}
.fw svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.fw .big{position:absolute;left:50%;top:50%;width:64px;height:80px;margin:-44px 0 0 -32px}
.week{display:flex;justify-content:space-between}
.week div{text-align:center;font-size:11px;font-weight:700;color:var(--mut)}
.week span{display:block;width:34px;height:34px;border-radius:50%;margin-top:5px;background:var(--l2);display:grid;place-items:center;color:#fff}
.week span.d{background:linear-gradient(150deg,var(--p),var(--p3))}
.bdg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;font-size:10px;font-weight:700;color:var(--mut)}
.bdg span{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;background:var(--l2);color:var(--l1);font:800 18px Georgia,serif;margin-bottom:4px}
.bdg .u span{background:linear-gradient(150deg,var(--p),var(--p3));color:#fff}
.q{border-left:4px solid var(--p2);padding-left:12px;margin:12px 0;-webkit-user-select:text;user-select:text}
.q p{margin:0 0 6px;font:italic 16px/1.5 Georgia,serif}
.ts{position:fixed;left:20px;right:20px;top:calc(14px + env(safe-area-inset-top));background:var(--ink);color:var(--l3);padding:13px 16px;border-radius:18px;font-weight:700;font-size:13px;z-index:60;text-align:center}
.sp{position:fixed;left:50%;top:38%;width:14px;height:14px;background:var(--p2);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:sp 1s ease-out forwards;z-index:70;pointer-events:none}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.rd{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.t-paper{background:#FAF6F0;color:#2b2118}.t-powder{background:#FFF5F8;color:var(--ink)}.t-night{background:#21111B;color:#FCE7F3}
.rh{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid rgba(128,128,128,.2)}
.rh span{flex:1;font-weight:700;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rh button{border:0;background:rgba(128,128,128,.14);color:inherit;border-radius:13px;min-width:42px;height:42px;font-weight:800;display:grid;place-items:center}
.rb{flex:1;overflow-y:auto;padding:22px 22px 60px;font-family:Georgia,"Times New Roman",serif;line-height:1.75;-webkit-user-select:text;user-select:text}
.rb p{margin:0 0 .9em;text-indent:1.3em}
.rf{padding:10px 18px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;border-top:1px solid rgba(128,128,128,.2)}
.rf .bar{flex:1;background:rgba(128,128,128,.25)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
textarea{resize:none}select{appearance:none}</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E11D74"/><stop offset=".55" stop-color="#FB7185"/><stop offset="1" stop-color="#FDBA74"/></linearGradient></defs></svg>
<div id="app"><header><div class="logo serif">SATUR<i>I</i></div><div style="display:flex;gap:8px"><button class="chip" id="gb" data-a="guest"></button><div class="chip" id="chip" data-a="tab" data-v="streak"></div></div></header><main id="main"></main></div>
<nav><button data-a="tab" data-v="shelf"></button><button data-a="tab" data-v="series"></button><button data-a="tab" data-v="streak"></button><button data-a="tab" data-v="quotes"></button><button data-a="tab" data-v="me"></button></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=p=>`<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const I={book:ic('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'),quote:ic('<path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/>'),set:ic('<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'),plus:ic('<path d="M12 5v14M5 12h14"/>'),back:ic('<path d="M15 18l-6-6 6-6"/>'),shield:ic('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'),shuf:ic('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'),spark:ic('<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>'),x:ic('<path d="M18 6 6 18M6 6l12 12"/>')};
const flame=c=>`<svg class="fl ${c||''}" viewBox="0 0 64 80"><path d="M32 4c2 14 22 22 22 44a22 22 0 0 1-44 0c0-10 6-15 10-20 1 6 4 8 6 8-2-12 2-22 6-32z" fill="url(#fg)"/><path d="M32 40c1 7 10 11 10 19a10 10 0 0 1-20 0c0-5 3-8 6-11 0 3 2 4 3 4-1-5 0-8 1-12z" fill="#FFF0F5" opacity=".92"/></svg>`;
const WELCOME="Здесь начинается твоя полка.\nПрочитай несколько минут в день, и огонёк в углу экрана загорится. Пропустишь день, и он потухнет, так что береги его.\nДобавляй свои книги кнопкой с плюсом: подойдут файлы txt и fb2. Бумажные книги тоже можно отмечать, тогда минуты чтения идут в огонёк.\nВыдели любую строку и нажми на кавычки наверху: цитата сохранится на отдельной вкладке.\nПриятного чтения.";
const G=[['#881337','#F472B6'],['#E11D74','#FDA4AF'],['#9D174D','#FB7185'],['#BE185D','#F9A8D4'],['#701A75','#FB7185'],['#DB2777','#FDBA74']];
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const diff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
let S=null;try{S=JSON.parse(localStorage.getItem('saturi'))}catch(e){}
S=S||{books:[{id:'w',title:'Добро пожаловать',author:'SATURI',st:'reading',pos:0,txt:true,r:0,g:0,pages:1,cur:0}],log:{},q:[],st:{streak:0,last:null,shields:0,best:0,lost:0},set:{goal:10,notif:false,time:'20:00',theme:'powder',fs:17,name:''}};
const DL=[{id:'all',n:'Всё',c:0,ic:0,goal:35},{id:'personal',n:'Личное',c:1,ic:1,goal:20},{id:'study',n:'Учёба',c:2,ic:2,goal:10},{id:'club',n:'Розовый книжный клуб',c:3,ic:3,goal:12},{id:'archive',n:'Архив',c:4,ic:4,goal:0}];
const norm=b=>Object.assign(b,{lib:b.lib||'personal',crit:b.crit||{},vibes:b.vibes||[],review:b.review||'',spoil:b.spoil||'',drop:b.drop||'',fin:b.fin||'',rr:b.rr||0,ser:b.ser||'',so:b.so||1,cols:b.cols||[],tags:b.tags||[],src:b.src||'купил',add:b.add||Date.now(),opened:b.opened||0,pages:b.pages||0,cur:b.cur||0});
S.libs=S.libs||DL;S.series=S.series||[];S.cols=S.cols||[];S.smart=S.smart||[];S.view=S.view||'grid';S.sort=S.sort||'opened';S.lib=S.lib||'all';S.set.spd=S.set.spd||50;S.books.forEach(norm);
const save=()=>{try{localStorage.setItem('saturi',JSON.stringify(S))}catch(e){toast('Не хватило памяти для сохранения')}};
const F0={st:'all',ser:'',col:'',tag:'',rate:0,len:'',started:0,unrated:0,smart:'',q:''};let tab='shelf',F={...F0},SP=0,R=null,pick=null,lastSel='',tt;
const bk=id=>S.books.find(b=>b.id===id),txt=b=>b.id==='w'?WELCOME:(localStorage.getItem('sat_t_'+b.id)||'');
const prog=b=>Math.round(100*(b.txt?b.pos:b.pages?Math.min(1,b.cur/b.pages):0));
const ln=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
function toast(m){clearTimeout(tt);document.querySelectorAll('.ts').forEach(e=>e.remove());const e=document.createElement('div');e.className='ts';e.textContent=m;document.body.appendChild(e);tt=setTimeout(()=>e.remove(),2600)}
function burst(){for(let i=0;i<16;i++){const e=document.createElement('i');e.className='sp';const a=Math.random()*6.28,d=80+Math.random()*110;e.style.cssText=`--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;background:${Math.random()>.5?'#E11D74':'#F472B6'}`;document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}}
function sheet(h){const od=$('.sh'),y=od?od.scrollTop:0;closeSh();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sh">${h}</div>`;o.onclick=e=>{if(e.target===o)closeSh()};document.body.appendChild(o);o.firstChild.scrollTop=y}
function closeSh(){document.querySelectorAll('.ov').forEach(e=>e.remove())}
function settle(){const s=S.st,t=dk();if(!s.last||s.last===t)return;const gap=diff(s.last,t)-1;if(gap<=0)return;if(s.shields>=gap){s.shields-=gap;s.last=dk(new Date(Date.now()-864e5))}else{if(s.streak>0)s.lost=s.streak;s.streak=0;s.last=null}save()}
function light(){const s=S.st,t=dk();s.streak++;s.best=Math.max(s.best,s.streak);s.last=t;s.lost=0;if(s.streak%7===0&&s.shields<2){s.shields++;toast('Новая заморозка за '+s.streak+' дней подряд')}else toast('Огонёк горит! Дней подряд: '+s.streak);save();burst();sched();render()}
function addSec(n){const t=dk();S.log[t]=(S.log[t]||0)+n;if(S.log[t]>=S.set.goal*60&&S.st.last!==t)light();else save();const m=$('#rm');if(m)m.textContent='Сегодня '+Math.min(S.set.goal,Math.floor(S.log[t]/60))+' из '+S.set.goal+' мин'}
setInterval(()=>{if(R&&!document.hidden)addSec(5)},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){settle();sched();render()}});
document.addEventListener('selectionchange',()=>{const s=getSelection().toString().trim();if(s)lastSel=s});
const MSG=[()=>`Огонёк ждёт тебя. ${S.set.goal} минут чтения, и он снова горит`,()=>'Чай налит, плед на месте. Самое время для книги',()=>'Одна глава перед сном? Огонёк очень просит',()=>'Загляни на пару страниц, чтобы огонёк не потух'];
async function sched(){const L=ln();if(!L||!S.set.notif)return;try{const p=await L.getPending();if(p.notifications.length)await L.cancel(p);const[h,m]=S.set.time.split(':').map(Number),n=[],now=new Date();for(let i=0;i<14;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,h,m,0);if(d<=now||(i===0&&S.st.last===dk()))continue;n.push({id:100+i,title:'SATURI',body:MSG[i%4](),schedule:{at:d,allowWhileIdle:true}})}if(n.length)await L.schedule({notifications:n})}catch(e){}}
async function perm(){const L=ln();if(L){const r=await L.requestPermissions();return r.display==='granted'}return'Notification'in window&&(await Notification.requestPermission())==='granted'}
const rdf=async f=>{const b=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('windows-1251').decode(b)}if(/\.fb2$/i.test(f.name)){const x=new DOMParser().parseFromString(t,'text/xml');t=[...x.querySelectorAll('body p')].map(p=>p.textContent.trim()).join('\n')}return t};
const img=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,320/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=fr.result};fr.readAsDataURL(f)});
const cover=b=>b.cov&&COV[b.id]?`<div class="cv" style="background:url(${COV[b.id]}) center"></div>`:`<div class="cv" style="background:linear-gradient(150deg,${G[b.g%G.length][0]},${G[b.g%G.length][1]})">${esc(b.title)}</div>`;
function state(){const s=S.st,t=dk();return s.last===t?'done':s.streak>0?'alive':'out'}
function render(){const st=state();document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('on',b.dataset.v===tab);b.innerHTML=[I.book+'Полка',I.spark+'Серии',flame('')+'Огонёк',I.quote+'Цитаты',I.set+'Ещё'][i];if(i===2){b.querySelector('svg').setAttribute('style','width:20px;height:24px')}});$('#chip').className='chip '+(st==='done'?'on-f':st==='out'?'off':'');$('#chip').innerHTML=flame('')+S.st.streak;$('#gb').innerHTML=isv(EYE,20);$('#gb').style.cssText='padding:8px 10px;'+(S.guest?'background:#3B0D22;color:#fff':'');$('#main').innerHTML={shelf:vShelf,series:vSeries,streak:vStreak,quotes:vQuotes,me:vMe}[tab]();$('#main').scrollTop=0;const f=$('#fab');if(f)f.remove();if(tab==='shelf'&&!S.guest){const b=document.createElement('button');b.id='fab';b.className='btn fab';b.dataset.a='add';b.innerHTML=I.plus;document.body.appendChild(b)}}
function vStreak(){const s=S.st,t=dk(),sec=S.log[t]||0,g=S.set.goal*60,st=state(),pc=Math.min(1,sec/g),C=2*Math.PI*78,lv=s.streak>=30?'Костёр':s.streak>=7?'Факел':s.streak>=3?'Свеча':'Искорка';
const msg=st==='done'?'Огонёк горит. Так держать!':st==='alive'?`Прочитай ещё ${Math.max(1,Math.ceil((g-sec)/60))} мин, и огонёк не потухнет сегодня`:s.lost?`Огонёк потух. Рекорд серии был ${s.lost} дн. Прочитай ${S.set.goal} мин, чтобы зажечь заново`:`Прочитай ${S.set.goal} мин, чтобы зажечь первый огонёк`;
const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return{l:d.toLocaleDateString('ru',{weekday:'short'}),on:(S.log[dk(d)]||0)>=g}});
const tot=Math.round(Object.values(S.log).reduce((a,b)=>a+b,0)/60);

${b.st==='dropped'&&!G?`<label>Почему отложила (необязательно)</label><input ${bf('drop')} value="${esc(b.drop)}">`:''}
${b.txt?`<button class="btn" style="width:100%" data-a="read" data-v="${id}">${prog(b)?'Продолжить, '+prog(b)+'%':'Начать читать'}</button>`:G?'':`<label>Страниц всего</label><input type="number" inputmode="numeric" ${bf('pages')} value="${b.pages||''}"><label>Страница сейчас</label><input type="number" inputmode="numeric" data-c="cur" data-id="${id}" value="${b.cur||0}"><label>Я почитала, засчитать в огонёк</label><div class="row">${[10,20,30].map(m=>`<button class="btn s" style="flex:1" data-a="mins" data-v="${m}">+${m} мин</button>`).join('')}</div>`}
<div class="card"><b>Оценка по критериям</b><div class="sub">Итог считается сам</div>${CR.map(c=>`<div class="row" style="padding:5px 0"><span>${c[1]}</span>${star(b.crit[c[0]]||0,c[0],G?0:id,20)}</div>`).join('')}</div>
<b>Вайб</b><div class="pills" style="flex-wrap:wrap">${V.map(v=>`<button class="pill ${b.vibes.includes(v[0])?'on':''}" ${G?'':`data-a="vibe" data-v="${id}|${v[0]}"`}>${v[1]}</button>`).join('')}</div>
${G?`<div class="sub">${b.tags.map(esc).join(', ')}</div>`:`<label>Рецензия</label><textarea rows="3" ${bf('review')}>${esc(b.review)}</textarea><div class="row"><b>Спойлер</b><button class="pill" data-a="spo" data-v="${id}">${SP?'Скрыть спойлер':'Показать спойлер'}</button></div>${SP?`<textarea rows="3" ${bf('spoil')}>${esc(b.spoil)}</textarea>`:'<div class="sub" style="margin:4px 0 10px">Текст скрыт, чтобы не наспойлерить</div>'}
<div class="row" style="align-items:flex-end"><div style="flex:1"><label>Дата прочтения</label><input type="date" ${bf('fin')} value="${b.fin}"></div><button class="btn s" style="margin-bottom:10px" data-a="rr" data-v="${id}">Перечитываю ×${b.rr}</button></div>
<label>Библиотека</label>${sel('lib',S.libs.filter(x=>x.id!=='all').map(x=>[x.id,x.n]),b.lib)}<label>Серия и номер в ней</label><div class="row">${sel('ser',[['','Без серии'],...S.series.map(s=>[s.id,s.n])],b.ser)}<input type="number" inputmode="numeric" style="width:80px;flex:none" ${bf('so')} value="${b.so}"></div>
<label>Коллекции</label><div class="pills" style="flex-wrap:wrap">${S.cols.map(c=>`<button class="pill ${b.cols.includes(c.id)?'on':''}" data-a="col" data-v="${id}|${c.id}">${esc(c.n)}</button>`).join('')||'<span class="sub">Создай коллекцию на вкладке Серии</span>'}</div>
<label>Теги через запятую (жанр, настроение)</label><input ${bf('tags')} value="${esc(b.tags.join(', '))}"><label>Источник</label>${sel('src',[['купил','Купила'],['подарили','Подарили'],['библиотека','Библиотека']],b.src)}<label>Сменить обложку</label><input type="file" accept="image/*" data-c="cov" data-id="${id}">${b.id==='w'?'':`<button class="btn s" style="width:100%" data-a="del" data-v="${id}">Убрать с полки</button>`}`}`)}
const A={tab:v=>{tab=v;render()},flt:v=>{F.st=v;render()},sheet:v=>{SP=0;sheetBook(v)},read:v=>openReader(v),
add:()=>sheet(`<h2 style="margin-bottom:10px">Новая книга</h2><label>Название (можно пустым, если выбираешь файл)</label><input id="nt"><label>Автор</label><input id="na"><label>Файлы книг (epub, fb2, txt), можно сразу несколько</label><input id="nf" type="file" multiple><label>Страниц в бумажной книге</label><input id="np" type="number" inputmode="numeric"><label>Обложка, если хочешь</label><input id="nc" type="file" accept="image/*"><button class="btn" style="width:100%" data-a="saveBook">Добавить на полку</button>`),
saveBook:async()=>{const fs=[...$('#nf').files],c=$('#nc').files[0],t0=$('#nt').value.trim(),one=fs.length<2;if(!t0&&!fs.length)return toast('Напиши название или выбери файл');toast('Загружаю, подожди немного');let n=0;
for(const f of(fs.length?fs:[null])){const b=norm({id:'b'+Date.now()+n,title:one?t0:'',author:one?$('#na').value.trim():'',st:'want',pos:0,pages:one?+$('#np').value||0:0,r:0,g:Math.floor(Math.random()*G.length),txt:false,lib:S.lib==='all'||S.lib==='archive'?'personal':S.lib});let cv=one?c:null;
if(f){try{let x,m={};if(/\.epub$/i.test(f.name)){m=await epub(f);x=m.text}else x=await rdf(f);if(!x.trim())throw 0;await idb('set','t_'+b.id,x);b.txt=true;b.pages=b.pages||Math.ceil(x.length/1800);b.title=b.title||m.title||f.name.replace(/\.\w+$/,'');b.author=b.author||m.author;cv=cv||m.cover}catch(e){toast('Не получилось прочитать '+f.name);continue}}
b.title=b.title||'Без названия';b.author=b.author||'Автор неизвестен';if(cv)try{await setCov(b,cv)}catch(e){}S.books.unshift(b);n++}
save();closeSh();render();toast('Добавлено книг: '+n)},
rate:v=>{const[i,n]=v.split('|'),b=bk(i);b.r=b.r===+n?0:+n;save();sheetBook(i)},stat:v=>{const[i,s]=v.split('|');setSt(bk(i),s);save();sheetBook(i);render()},
mins:v=>{addSec(+v*60);toast('Засчитано: +'+v+' мин')},del:v=>{if(!confirm('Убрать книгу с полки?'))return;S.books=S.books.filter(b=>b.id!==v);idb('del','t_'+v);idb('del','c_'+v);delete COV[v];save();closeSh();render()},
closeR:()=>{R=null;$('#rd').remove();save();render()},fs:()=>{S.set.fs=S.set.fs>=24?15:S.set.fs+2;$('#rb').style.fontSize=S.set.fs+'px';save()},
th:()=>{const o=['paper','powder','night'];S.set.theme=o[(o.indexOf(S.set.theme)+1)%3];$('#rd').className='rd t-'+S.set.theme;save()},
saveQ:()=>{if(!lastSel)return toast('Сначала выдели строку');S.q.unshift({t:lastSel.slice(0,500),b:bk(R.id).title});lastSel='';getSelection().removeAllRanges();save();toast('Цитата сохранена')},
delq:v=>{S.q.splice(+v,1);save();render()},
wheel:()=>{const l=S.books.filter(b=>b.st!=='done');if(!l.length)return toast('Добавь книгу на полку');sheet(`<h2 style="text-align:center">Что почитать?</h2><div id="wh" class="card" style="text-align:center;font:800 20px Georgia,serif;min-height:96px;display:grid;place-items:center"></div><div class="row"><button class="btn s" style="flex:1" data-a="wheel">Ещё раз</button><button class="btn" style="flex:1" data-a="wgo">Читать</button></div>`);let n=0;const iv=setInterval(()=>{const w=$('#wh');if(!w)return clearInterval(iv);pick=l[Math.floor(Math.random()*l.length)];w.textContent=pick.title;if(++n>14){clearInterval(iv);w.style.color='#E11D74'}},90)},
wgo:()=>{if(!pick)return;pick.txt?openReader(pick.id):sheetBook(pick.id)},
test:async()=>{if(!(await perm()))return toast('Разреши уведомления в настройках телефона');const L=ln(),o={title:'SATURI',body:'Огонёк на связи. Уведомления работают'};if(L)await L.schedule({notifications:[{id:1,...o,schedule:{at:new Date(Date.now()+3000)}}]});else new Notification(o.title,{body:o.body});toast('Жди уведомление')},
reset:()=>{if(!confirm('Удалить все книги, цитаты и огонёк?'))return;DB.then(d=>{d.close();indexedDB.deleteDatabase('saturi');localStorage.clear();setTimeout(()=>location.reload(),400)})}};
const C={name:v=>{S.set.name=v.trim();save()},goal:v=>{S.set.goal=+v;save();sched()},time:v=>{S.set.time=v||'20:00';save();sched()},
notif:async(v,t)=>{if(t.checked&&!(await perm())){t.checked=false;return toast('Разреши уведомления в настройках телефона')}S.set.notif=t.checked;save();if(t.checked){sched();toast('Напоминания включены')}else{const L=ln();if(L)try{await L.cancel(await L.getPending())}catch(e){}}},
cur:(v,t)=>{const b=bk(t.dataset.id);b.cur=Math.max(0,+v||0);if(b.pages&&b.cur>=b.pages)setSt(b,'done');else if(b.cur>0&&b.st==='want')b.st='reading';save();render()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v,t)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-c]');if(t&&C[t.dataset.c])C[t.dataset.c](t.value,t)});
Object.assign(A,{sr:v=>{const[i,k,n]=v.split('|'),b=bk(i),x=+n;if(k==='r')b.r=b.r===x?0:x;else{b.crit[k]=b.crit[k]===x?0:x;const a=Object.values(b.crit).filter(Boolean);if(a.length)b.r=Math.round(a.reduce((p,c)=>p+c,0)/a.length*2)/2}save();sheetBook(i);render()},
vibe:v=>{const[i,k]=v.split('|'),b=bk(i);b.vibes=b.vibes.includes(k)?b.vibes.filter(x=>x!==k):[...b.vibes,k];save();sheetBook(i)},spo:v=>{SP=!SP;sheetBook(v)},rr:v=>{const b=bk(v);b.rr++;save();sheetBook(v);toast('Перечитываний: '+b.rr)},
col:v=>{const[i,c]=v.split('|'),b=bk(i);b.cols=b.cols.includes(c)?b.cols.filter(x=>x!==c):[...b.cols,c];save();sheetBook(i)},view:v=>{S.view=v;save();render()},
guest:()=>{S.guest=!S.guest;if(S.guest&&S.lib==='archive')S.lib='all';save();toast(S.guest?'Гостевой режим: личное скрыто':'Гостевой режим выключен');render()},lib:v=>{S.lib=v;save();render()},
goal:()=>{const L=S.libs.find(x=>x.id===S.lib),n=prompt('Цель, книг',L.goal);if(n&&+n>0){L.goal=+n;save();render()}},x:closeSh,
newLib:()=>sheet(`<h2>Новая библиотека</h2><label>Название</label><input id="ln" value="${esc(nl.n||'')}" placeholder="Для работы, Романтика"><label>Цель, книг</label><input id="lg" type="number" inputmode="numeric" value="${nl.g||10}"><label>Цвет</label><div class="row">${LC.slice(0,4).map((c,i)=>`<button data-a="nlc" data-v="${i}" style="width:48px;height:48px;border-radius:50%;border:${nl.c===i?'3px solid #3B0D22':'0'};background:linear-gradient(150deg,${c[0]},${c[1]})"></button>`).join('')}</div><label style="display:block;margin-top:12px">Значок</label><div class="row">${LI.map((p,i)=>`<button class="pill ${nl.ic===i?'on':''}" data-a="nli" data-v="${i}" style="padding:10px">${isv(p,20)}</button>`).join('')}</div><button class="btn" style="width:100%;margin-top:16px" data-a="saveLib">Создать</button>`),
nlc:v=>{nl.n=$('#ln').value;nl.g=$('#lg').value;nl.c=+v;A.newLib()},nli:v=>{nl.n=$('#ln').value;nl.g=$('#lg').value;nl.ic=+v;A.newLib()},
saveLib:()=>{const n=$('#ln').value.trim();if(!n)return toast('Напиши название');const x={id:'l'+Date.now(),n,c:nl.c,ic:nl.ic,goal:+$('#lg').value||10},ai=S.libs.findIndex(y=>y.id==='archive');S.libs.splice(ai<0?S.libs.length:ai,0,x);S.lib=x.id;nl={c:0,ic:0};save();closeSh();render()},
newSer:()=>sheet(`<h2>Новая серия</h2><label>Название</label><input id="sn"><label>Книг в серии</label><input id="sc" type="number" inputmode="numeric" placeholder="7"><button class="btn" style="width:100%" data-a="saveSer">Создать</button>`),
saveSer:()=>{const n=$('#sn').value.trim();if(!n)return toast('Напиши название');S.series.push({id:'s'+Date.now(),n,t:+$('#sc').value||0});save();closeSh();render()},
newCol:()=>sheet(`<h2>Новая коллекция</h2><label>Название</label><input id="cn" placeholder="Летнее чтение"><button class="btn" style="width:100%" data-a="saveCol">Создать</button>`),
saveCol:()=>{const n=$('#cn').value.trim();if(!n)return toast('Напиши название');S.cols.push({id:'c'+Date.now(),n});save();closeSh();render()},
openSer:v=>{F={...F0,ser:v};S.lib='all';tab='shelf';render()},
delSer:v=>{if(!confirm('Удалить серию? Книги останутся'))return;S.series=S.series.filter(s=>s.id!==v);S.books.forEach(b=>{if(b.ser===v)b.ser=''});save();render()},
delCol:v=>{if(!confirm('Удалить коллекцию? Книги останутся'))return;S.cols=S.cols.filter(c=>c.id!==v);S.books.forEach(b=>b.cols=b.cols.filter(c=>c!==v));save();render()},
smart:v=>{if(v[0]==='S')F={...F0,...S.smart[+v.slice(1)].f};else F.smart=v;render()},fclr:()=>{F={...F0};closeSh();render()},
fsave:()=>{const n=prompt('Название умной полки');if(!n)return;S.smart.push({n,f:{...F}});save();closeSh();render();toast('Умная полка сохранена')},
filt:()=>{const o=(a,v)=>a.map(x=>`<option value="${x[0]}" ${String(x[0])===String(v)?'selected':''}>${esc(x[1])}</option>`).join(''),sw=(k,t)=>`<div class="row" style="padding:6px 0"><span>${t}</span><span class="sw"><input type="checkbox" data-c="f" data-k="${k}" ${F[k]?'checked':''}><s></s></span></div>`;
sheet(`<h2>Фильтры</h2><label>Серия</label><select data-c="f" data-k="ser">${o([['','Любая'],...S.series.map(s=>[s.id,s.n])],F.ser)}</select><label>Коллекция</label><select data-c="f" data-k="col">${o([['','Любая'],...S.cols.map(s=>[s.id,s.n])],F.col)}</select><label>Тег или жанр</label><input data-c="f" data-k="tag" value="${esc(F.tag)}"><label>Оценка не ниже</label><select data-c="f" data-k="rate">${o([[0,'Любая'],[3,'3'],[4,'4'],[4.5,'4.5']],F.rate)}</select><label>Длина</label><select data-c="f" data-k="len">${o([['','Любая'],['short','Короткие, до 300 стр.'],['long','Длинные, больше 500 стр.']],F.len)}</select>${sw('started','Только начатые')}${sw('unrated','Только неоценённые')}<div class="row" style="margin-top:14px"><button class="btn s" style="flex:1" data-a="fclr">Сбросить</button><button class="btn s" style="flex:1" data-a="fsave">В умную полку</button></div><button class="btn" style="width:100%;margin-top:10px" data-a="x">Готово</button>`)}});
Object.assign(C,{cov:async(v,t)=>{const f=t.files[0];if(!f)return;await setCov(bk(t.dataset.id),f);save();sheetBook(t.dataset.id);render()},bf:(v,t)=>{const b=bk(t.dataset.id),k=t.dataset.k;if(k==='tags')b.tags=v.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);else b[k]=['so','pages'].includes(k)?+v||0:v;save();if(['lib','ser','pages','fin'].includes(k))render()},
f:(v,t)=>{F[t.dataset.k]=t.type==='checkbox'?(t.checked?1:0):t.dataset.k==='rate'?+v:v;render()},sort:v=>{S.sort=v;save();render()},fq:v=>{F.q=v;render()},spd:v=>{S.set.spd=Math.max(10,+v||50);save()}});
let tx=0;$('#main').addEventListener('touchstart',e=>tx=e.touches[0].clientX);$('#main').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(tab==='shelf'&&Math.abs(d)>90&&!e.target.closest('.pills')){const l=S.libs.filter(x=>!S.guest||x.id===S.lib),i=l.findIndex(x=>x.id===S.lib)+(d<0?1:-1);if(l[i]){S.lib=l[i].id;save();render()}}});
(async()=>{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();try{for(const k of Object.keys(localStorage))if(k.startsWith('sat_t_')){await idb('set','t_'+k.slice(6),localStorage.getItem(k));localStorage.removeItem(k)}for(const b of S.books){if(typeof b.cov==='string'){COV[b.id]=b.cov;await idb('set','c_'+b.id,b.cov);b.cov=1}else if(b.cov)COV[b.id]=await idb('get','c_'+b.id)}save()}catch(e){toast('Хранилище недоступно')}settle();render();sched()})();
</script></body></html>
